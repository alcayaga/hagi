<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nadeshiko Search</title>
    <!-- Use Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen dark:bg-gray-900 dark:text-gray-100 transition-colors">
    <div class="container mx-auto p-8">
        <h1 class="text-4xl font-bold mb-8 text-center text-indigo-600 dark:text-indigo-400">Nadeshiko Search</h1>
        
        <!-- Search & Config -->
        <div class="flex flex-col justify-center items-center gap-4 mb-8">
            <div class="flex flex-col md:flex-row w-full gap-4">
                <input type="text" id="searchInput" placeholder="Search for a word (e.g. Asakura, -English)" class="flex-grow p-4 rounded shadow text-lg outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-100">
                <button onclick="performSearch()" class="bg-indigo-600 text-white px-8 py-4 rounded shadow hover:bg-indigo-700 text-lg w-full md:w-auto">Search</button>
            </div>
            
            <div class="flex flex-wrap justify-center items-center gap-4 w-full">
                <div class="flex gap-2">
                    <select id="filterShow" onchange="renderResults()" class="p-2 border rounded shadow-sm dark:bg-gray-800 dark:border-gray-700 dark:text-white w-48 md:w-64">
                        <option value="">All Shows</option>
                    </select>
                    <input type="number" id="filterEpisode" onkeyup="renderResults()" onchange="renderResults()" placeholder="Ep" class="p-2 border rounded shadow-sm dark:bg-gray-800 dark:border-gray-700 dark:text-white w-20">
                </div>
                
                <div class="flex gap-2 items-center bg-white dark:bg-gray-800 p-2 rounded shadow-sm border dark:border-gray-700">
                    <div class="flex flex-col px-2">
                        <label class="text-xs text-gray-500 dark:text-gray-400 font-bold uppercase">Pad Start</label>
                        <input type="number" id="padStart" value="0.5" step="0.1" class="w-16 p-1 border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                    </div>
                    <div class="flex flex-col px-2 border-l dark:border-gray-700">
                        <label class="text-xs text-gray-500 dark:text-gray-400 font-bold uppercase">Pad End</label>
                        <input type="number" id="padEnd" value="0.5" step="0.1" class="w-16 p-1 border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden flex justify-center items-center mb-8">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
            <span class="ml-2 text-indigo-600 dark:text-indigo-400 font-semibold">Searching...</span>
        </div>

        <!-- Results Table -->
        <div class="bg-white dark:bg-gray-800 rounded shadow overflow-hidden border dark:border-gray-700">
            <table class="w-full text-left border-collapse" id="resultsTable">
                <thead>
                    <tr class="bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 uppercase text-sm font-bold">
                        <th class="px-6 py-4">Lang</th>
                        <th class="px-6 py-4">Time</th>
                        <th class="px-6 py-4 w-1/2">Text</th>
                        <th class="px-6 py-4">Source</th>
                        <th class="px-6 py-4 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="resultsBody" class="divide-y divide-gray-200 dark:divide-gray-700 text-gray-800 dark:text-gray-200">
                    <tr>
                        <td colspan="5" class="px-6 py-4 text-center text-gray-500 dark:text-gray-400">Enter a keyword to start searching</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Extraction Modal -->
    <div id="mediaModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex justify-center items-center p-4 z-50">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-2xl w-full overflow-hidden border dark:border-gray-700">
            <div class="p-4 border-b dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-700">
                <h3 class="font-bold text-lg dark:text-white">Extracted Media</h3>
                <button onclick="closeModal('mediaModal', 'mediaAudio')" class="text-gray-500 hover:text-red-500 dark:text-gray-300 dark:hover:text-red-400 font-bold text-xl">&times;</button>
            </div>
            <div class="p-6 flex flex-col items-center gap-6">
                <img id="mediaImage" src="" alt="Snapshot" class="rounded shadow border border-gray-200 dark:border-gray-600 max-h-64 object-cover w-full">
                <audio id="mediaAudio" controls class="w-full"></audio>
                <p id="mediaText" class="text-xl text-center font-medium dark:text-gray-200"></p>
            </div>
        </div>
    </div>

    <!-- Context Modal -->
    <div id="contextModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex justify-center items-center p-4 z-50">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-3xl w-full overflow-hidden border dark:border-gray-700 flex flex-col max-h-[80vh]">
            <div class="p-4 border-b dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-700">
                <h3 class="font-bold text-lg dark:text-white">Conversation Context</h3>
                <button onclick="closeModal('contextModal')" class="text-gray-500 hover:text-red-500 dark:text-gray-300 dark:hover:text-red-400 font-bold text-xl">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto flex-grow bg-white dark:bg-gray-800">
                <div id="contextLoading" class="flex justify-center items-center py-8 hidden">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
                </div>
                <div id="contextList" class="flex flex-col gap-2"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') performSearch();
        });

        // Store all results locally so we can filter them on the client side
        let allSearchResults = [];

        async function performSearch() {
            const query = document.getElementById('searchInput').value;
            const loading = document.getElementById('loading');
            const tbody = document.getElementById('resultsBody');
            
            if (!query.trim()) return;

            loading.classList.remove('hidden');
            tbody.innerHTML = '';

            // Reset filters on a new search
            document.getElementById('filterShow').innerHTML = '<option value="">All Shows</option>';
            document.getElementById('filterEpisode').value = '';

            try {
                // Fetch ALL results matching the keyword
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                allSearchResults = await response.json();
                
                // Extract unique shows to populate the dropdown
                const uniqueShows = [...new Set(allSearchResults.map(r => r.show_title || r.path.split('/').pop()))];
                uniqueShows.sort();
                
                const showDropdown = document.getElementById('filterShow');
                uniqueShows.forEach(show => {
                    const option = document.createElement('option');
                    option.value = show;
                    option.innerText = show;
                    showDropdown.appendChild(option);
                });

                // Render the table
                renderResults();
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-red-500">Error fetching results: ${error}</td></tr>`;
            } finally {
                loading.classList.add('hidden');
            }
        }

        function renderResults() {
            const tbody = document.getElementById('resultsBody');
            const showFilter = document.getElementById('filterShow').value;
            const epFilter = document.getElementById('filterEpisode').value;
            
            tbody.innerHTML = '';

            // Apply client-side filters
            let filtered = allSearchResults;
            if (showFilter) {
                filtered = filtered.filter(r => (r.show_title || r.path.split('/').pop()) === showFilter);
            }
            if (epFilter) {
                filtered = filtered.filter(r => r.episode == epFilter);
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500 dark:text-gray-400">No results found matching your filters</td></tr>`;
                return;
            }

            filtered.forEach(r => {
                const m = Math.floor(r.start_time / 60).toString().padStart(2, '0');
                const s = Math.floor(r.start_time % 60).toString().padStart(2, '0');
                const timeStr = `${m}:${s}`;
                
                let sourceDisplay = r.path.split('/').pop();
                if (r.show_title) {
                    sourceDisplay = `${r.show_title}`;
                    if (r.episode !== null) sourceDisplay += ` - Ep ${r.episode}`;
                }
                
                let langClass = "bg-gray-200 text-gray-800 dark:bg-gray-700 dark:text-gray-200";
                if (r.language === 'jpn') langClass = "bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200";
                if (r.language === 'eng') langClass = "bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200";
                if (r.language === 'spa') langClass = "bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200";
                if (r.language === 'por') langClass = "bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200";

                const row = document.createElement('tr');
                row.className = "hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors";
                row.innerHTML = `
                    <td class="px-6 py-4"><span class="px-2 py-1 rounded text-sm font-bold ${langClass}">${r.language.toUpperCase()}</span></td>
                    <td class="px-6 py-4 text-sm text-gray-500 dark:text-gray-400">${timeStr}</td>
                    <td class="px-6 py-4 text-lg font-medium">${r.text}</td>
                    <td class="px-6 py-4 text-xs text-gray-400 max-w-xs truncate" title="${sourceDisplay}">${sourceDisplay}</td>
                    <td class="px-6 py-4">
                        <div class="flex flex-col items-center space-y-2">
                            <button onclick="viewContext(${r.id})" class="w-20 bg-gray-100 text-gray-700 dark:bg-gray-600 dark:text-gray-200 px-3 py-1 rounded hover:bg-gray-200 dark:hover:bg-gray-500 font-semibold text-sm transition shadow-sm">Context</button>
                            <button onclick="extractMedia(${r.id}, this)" class="w-20 bg-indigo-100 text-indigo-700 dark:bg-indigo-900 dark:text-indigo-200 px-3 py-1 rounded hover:bg-indigo-200 dark:hover:bg-indigo-800 font-semibold text-sm transition shadow-sm">Extract</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function extractMedia(id, btnElement) {
            const padStart = parseFloat(document.getElementById('padStart').value) || 0.5;
            const padEnd = parseFloat(document.getElementById('padEnd').value) || 0.5;

            const originalText = btnElement.innerText;
            btnElement.innerText = "Wait...";
            btnElement.disabled = true;
            btnElement.classList.add('opacity-50');

            try {
                const response = await fetch(`/api/extract/${id}`, { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pad_start: padStart, pad_end: padEnd })
                });
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('mediaText').innerText = data.text;
                    document.getElementById('mediaImage').src = data.image_url + "?t=" + new Date().getTime();
                    document.getElementById('mediaAudio').src = data.audio_url + "?t=" + new Date().getTime();
                    document.getElementById('mediaAudio').play();
                    document.getElementById('mediaModal').classList.remove('hidden');
                } else {
                    alert("Extraction failed: " + data.detail);
                }
            } catch (error) {
                alert("Error calling extraction API: " + error);
            } finally {
                btnElement.innerText = originalText;
                btnElement.disabled = false;
                btnElement.classList.remove('opacity-50');
            }
        }

        async function viewContext(id) {
            document.getElementById('contextModal').classList.remove('hidden');
            const list = document.getElementById('contextList');
            const loading = document.getElementById('contextLoading');
            
            list.innerHTML = '';
            loading.classList.remove('hidden');

            try {
                const response = await fetch(`/api/context/${id}`);
                const data = await response.json();
                
                if (data.target_context.length === 0) {
                    list.innerHTML = `<p class="text-gray-500">No context available.</p>`;
                } else {
                    const hasJpn = data.jpn_context && data.jpn_context.length > 0;
                    
                    if (hasJpn) {
                        const grid = document.createElement('div');
                        grid.className = "grid grid-cols-2 gap-4";
                        
                        const colTarget = document.createElement('div');
                        colTarget.className = "flex flex-col gap-2 border-r dark:border-gray-700 pr-4";
                        colTarget.innerHTML = `<h4 class="font-bold text-gray-400 mb-2 uppercase text-xs">${data.target_lang} Track</h4>`;
                        
                        const colJpn = document.createElement('div');
                        colJpn.className = "flex flex-col gap-2 pl-2";
                        colJpn.innerHTML = `<h4 class="font-bold text-gray-400 mb-2 uppercase text-xs">JPN Track</h4>`;
                        
                        const renderSentences = (sentences, container) => {
                            sentences.forEach(r => {
                                const m = Math.floor(r.start_time / 60).toString().padStart(2, '0');
                                const s = Math.floor(r.start_time % 60).toString().padStart(2, '0');
                                const timeStr = `${m}:${s}`;
                                
                                const isTarget = r.id === id;
                                const bgClass = isTarget ? "bg-indigo-50 dark:bg-indigo-900 border-indigo-200 dark:border-indigo-700 shadow-inner" : "bg-gray-50 dark:bg-gray-700 border-transparent";
                                
                                const div = document.createElement('div');
                                div.className = `p-2 rounded border ${bgClass}`;
                                div.innerHTML = `
                                    <span class="text-xs text-gray-500 dark:text-gray-400 font-mono block mb-1">[${timeStr}]</span>
                                    <span class="text-sm ${isTarget ? 'font-bold text-indigo-700 dark:text-indigo-300' : ''}">${r.text}</span>
                                `;
                                container.appendChild(div);

                                if (isTarget) {
                                    setTimeout(() => div.scrollIntoView({ behavior: "smooth", block: "center" }), 100);
                                }
                            });
                        };
                        
                        renderSentences(data.target_context, colTarget);
                        renderSentences(data.jpn_context, colJpn);
                        
                        grid.appendChild(colTarget);
                        grid.appendChild(colJpn);
                        list.appendChild(grid);
                    } else {
                        data.target_context.forEach(r => {
                            const m = Math.floor(r.start_time / 60).toString().padStart(2, '0');
                            const s = Math.floor(r.start_time % 60).toString().padStart(2, '0');
                            const timeStr = `${m}:${s}`;
                            
                            const isTarget = r.id === id;
                            const bgClass = isTarget ? "bg-indigo-50 dark:bg-indigo-900 border-indigo-200 dark:border-indigo-700 shadow-inner" : "bg-gray-50 dark:bg-gray-700 border-transparent";
                            
                            const div = document.createElement('div');
                            div.className = `p-3 rounded border ${bgClass}`;
                            div.innerHTML = `
                                <span class="text-sm text-gray-500 dark:text-gray-400 font-mono mr-2">[${timeStr}]</span>
                                <span class="${isTarget ? 'font-bold text-indigo-700 dark:text-indigo-300' : ''}">${r.text}</span>
                            `;
                            list.appendChild(div);

                            if (isTarget) {
                                setTimeout(() => div.scrollIntoView({ behavior: "smooth", block: "center" }), 100);
                            }
                        });
                    }
                }
            } catch (error) {
                list.innerHTML = `<p class="text-red-500">Error fetching context: ${error}</p>`;
            } finally {
                loading.classList.add('hidden');
            }
        }

        function closeModal(modalId, audioId = null) {
            document.getElementById(modalId).classList.add('hidden');
            if (audioId) {
                document.getElementById(audioId).pause();
            }
        }
    </script>
</body>
</html>
