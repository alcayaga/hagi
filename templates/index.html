<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hagi Search</title>
    <!-- Use Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen dark:bg-gray-900 dark:text-gray-100 transition-colors">
    <div class="container mx-auto p-4 md:p-8">
      <!-- App Header -->
      <div class="flex flex-col items-center justify-center mb-8 mt-4">
        <div class="flex items-center gap-3">
          <!-- Sleek SVG Logo -->
          <div class="bg-indigo-600 text-white p-2 rounded-lg shadow-md transform rotate-3">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </div>
          <h1 class="text-3xl font-extrabold tracking-tight text-gray-900 dark:text-white">Hagi <span class="text-indigo-600 dark:text-indigo-400">Search</span></h1>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="relative max-w-3xl mx-auto mb-6">
        <input type="text" id="searchInput" placeholder="Search for a Japanese phrase or translation..." class="w-full p-4 pl-14 text-lg rounded-2xl shadow-md border-0 ring-1 ring-gray-200 dark:ring-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 transition-shadow" />
        <svg class="absolute left-5 top-4.5 h-6 w-6 text-gray-400" style="top: 18px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <button onclick="performSearch()" class="absolute right-2 top-2 bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-indigo-700 transition shadow-sm">Search</button>
      </div>

      <!-- Filters & Controls -->
      <div id="filtersAndControlsWrapper" class="hidden max-w-3xl mx-auto mb-8 flex flex-col md:flex-row justify-between items-end gap-4 border-b dark:border-gray-700 pb-4">
        <!-- Search Filters -->
        <div class="flex flex-col gap-1.5 flex-1 w-full">
          <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider ml-1 flex items-center h-4">Filter Results</span>
          <div class="flex flex-nowrap overflow-x-auto gap-2 w-full items-center p-1 -m-1 [&::-webkit-scrollbar]:hidden" style="scrollbar-width: none;">
            
            <div class="relative flex-1 min-w-0 md:flex-none md:w-64">
              <select id="filterShow" onchange="onShowChange()" class="w-full h-9 appearance-none bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-full pl-4 pr-8 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 focus:ring-2 focus:ring-indigo-500 cursor-pointer shadow-sm transition-colors">
                <option value="">All Shows</option>
              </select>
              <svg class="absolute right-3 top-2.5 w-4 h-4 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
            
            <div id="episodeWrapper" class="relative hidden w-36 flex-shrink-0 md:w-48">
              <select id="filterEpisode" onchange="onEpisodeChange()" class="w-full h-9 appearance-none bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-full pl-4 pr-8 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 focus:ring-2 focus:ring-indigo-500 cursor-pointer shadow-sm transition-colors">
                <option value="">All Episodes</option>
              </select>
              <svg class="absolute right-3 top-2.5 w-4 h-4 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>

          </div>
        </div>

        <!-- Extraction Settings -->
        <div class="flex flex-col gap-1.5 w-full md:w-auto">
          <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider ml-1 flex items-center gap-1 h-4">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            Extraction Padding (s)
          </span>
          <div class="flex items-center w-full h-9 bg-white dark:bg-gray-800 rounded-full shadow-sm border border-gray-200 dark:border-gray-700 px-3">
            <div class="flex-1 flex justify-center items-center px-1 border-r border-gray-100 dark:border-gray-700 h-full">
              <label class="text-[11px] text-gray-500 font-bold uppercase mr-1">Start</label>
              <input type="number" id="padStart" value="0.5" step="0.1" class="w-12 bg-transparent text-sm font-mono text-center text-gray-700 dark:text-gray-200 focus:outline-none" />
            </div>
            <div class="flex-1 flex justify-center items-center px-1 ml-1 h-full">
              <label class="text-[11px] text-gray-500 font-bold uppercase mr-1">End</label>
              <input type="number" id="padEnd" value="0.5" step="0.1" class="w-12 bg-transparent text-sm font-mono text-center text-gray-700 dark:text-gray-200 focus:outline-none" />
            </div>
          </div>
        </div>
      </div>

      <!-- Loading Indicator -->
      <div id="loading" class="hidden flex justify-center items-center mb-8">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
        <span class="ml-2 text-indigo-600 dark:text-indigo-400 font-semibold">Searching...</span>
      </div>

      <!-- Results List -->
      <div id="resultsList" class="flex flex-col gap-3 max-w-4xl mx-auto"></div>
    </div>

    <!-- Extraction Modal -->
    <div id="mediaModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex justify-center items-center p-2 md:p-4 z-50">
      <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-5xl w-full flex flex-col max-h-[90vh] overflow-hidden border dark:border-gray-700">
        <div class="p-4 md:px-6 border-b dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-700 flex-shrink-0">
          <div class="flex items-center gap-2 w-full pr-4 overflow-hidden">
            <button id="mediaModalBackButton" onclick="toggleModalView('mediaExtractView')" class="hidden flex-shrink-0 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 transition">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <div id="mediaMetadata" class="truncate w-full">Extracted Media</div>
          </div>
          <button onclick="closeModal('mediaModal', 'mediaAudio')" class="flex-shrink-0 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        <div class="relative overflow-hidden flex-grow flex flex-col">
          <!-- View 1: Extract -->
          <div id="mediaExtractView" class="p-4 md:p-6 overflow-y-auto flex-grow flex flex-col md:flex-row gap-6 md:gap-8 transition-transform duration-300 w-full">
            <!-- Left Column -->
            <div class="w-full md:w-2/5 flex flex-col gap-4 justify-center">
              <div class="relative w-full cursor-pointer group rounded-lg overflow-hidden border border-gray-200 dark:border-gray-600 shadow-sm" onclick="replayAudio()">
                <img id="mediaImage" src="" alt="Snapshot" class="w-full object-contain bg-black block" />
  
                <!-- Play Button Overlay -->
                <div class="absolute inset-0 flex justify-center items-center opacity-0 group-hover:opacity-100 transition duration-200 bg-black bg-opacity-20">
                  <div class="bg-black bg-opacity-60 text-white rounded-full p-3 backdrop-blur-sm shadow-lg transform transition group-hover:scale-110 group-active:scale-95">
                    <svg class="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 24 24">
                      <path d="M8 5v14l11-7z" />
                    </svg>
                  </div>
                </div>
  
                <!-- Timestamp Overlay -->
                <div id="mediaTimestampBadge" class="absolute bottom-2 right-2 bg-black bg-opacity-75 text-white text-xs font-mono px-1.5 py-0.5 rounded shadow z-10"></div>
  
                <div id="mediaModalLoading" class="hidden absolute inset-0 bg-black bg-opacity-50 flex justify-center items-center">
                  <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-white"></div>
                </div>
              </div>
              <audio id="mediaAudio" class="hidden"></audio>
            </div>
  
            <!-- Right Column -->
            <div class="w-full md:w-3/5 flex flex-col gap-4">
              <div>
                <p id="mediaText" class="text-2xl font-bold dark:text-gray-100"></p>
                <div id="mediaTranslations" class="mt-2 text-left inline-block"></div>
              </div>
              <!-- Timeline Controls -->
              <div class="flex flex-col w-full gap-2 mt-auto">
                <div class="flex justify-between items-center px-1">
                  <span class="text-xs text-gray-500 dark:text-gray-400 font-bold uppercase tracking-wide">Fine-tune Extraction</span>
                  <span class="text-xs font-mono text-gray-500" id="timelineDurationDisplay">0.00s</span>
                </div>
  
                <!-- Custom Timeline Range Slider -->
                <div class="relative w-full h-10 bg-white dark:bg-gray-800 rounded border dark:border-gray-600 overflow-hidden select-none touch-none" id="timelineContainer">
                  <!-- JS will populate grid, marks, and draggable selection handles here -->
                </div>
  
                <div class="flex justify-between items-center mt-1">
                  <div class="flex gap-2 items-center text-[10px] text-gray-400" id="timelineLegend">
                    <!-- JS will populate this -->
                  </div>
                  <button id="btnReextract" onclick="applyTimelineExtraction()" class="bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-200 px-3 py-1.5 rounded hover:bg-gray-200 dark:hover:bg-gray-600 transition shadow-sm text-sm font-semibold">Apply & Re-extract</button>
                </div>
              </div>
  
              <!-- Actions -->
              <div class="flex flex-wrap sm:flex-nowrap gap-2 w-full border-t dark:border-gray-700 pt-4">
                <!-- Grouped Copy Actions -->
                <div class="relative group">
                  <button class="flex items-center justify-center gap-2 bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-200 px-3 py-2 rounded hover:bg-gray-200 dark:hover:bg-gray-600 transition shadow-sm text-sm font-semibold h-full whitespace-nowrap">
                    <svg class="h-4 w-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    Copy
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                  </button>
                  <div class="absolute bottom-full left-0 mb-1 hidden group-hover:block group-focus-within:block w-32 bg-white dark:bg-gray-800 border dark:border-gray-700 rounded shadow-lg overflow-hidden z-50">
                    <button onclick="copyExtractItem('image', this)" class="w-full text-left px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm dark:text-gray-200">Image</button>
                    <button onclick="copyExtractItem('audio', this)" class="w-full text-left px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm dark:text-gray-200 border-t dark:border-gray-700">Audio</button>
                    <button onclick="copyExtractItem('text', this)" class="w-full text-left px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm dark:text-gray-200 border-t dark:border-gray-700">Phrase</button>
                  </div>
                </div>
                
                <!-- Anki Buttons -->
                <button onclick="sendToAnki(this)" class="flex-1 flex items-center justify-center gap-2 bg-indigo-600 text-white dark:bg-indigo-600 dark:text-white px-2 py-2 rounded hover:bg-indigo-700 dark:hover:bg-indigo-500 transition shadow-sm text-sm font-semibold">
                  <svg class="h-4 w-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                  </svg>
                  <span class="whitespace-nowrap">Anki (New/Last)</span>
                </button>
                <button onclick="toggleModalView('mediaAnkiSearchView')" class="flex-1 flex items-center justify-center gap-2 bg-white text-indigo-600 dark:bg-gray-800 dark:text-indigo-400 border border-indigo-600 dark:border-indigo-400 px-2 py-2 rounded hover:bg-indigo-50 dark:hover:bg-gray-700 transition shadow-sm text-sm font-semibold">
                  <span class="whitespace-nowrap">Anki (Specific)</span>
                </button>
              </div>
            </div>
          </div>

          <!-- View 2: Anki Search -->
          <div id="mediaAnkiSearchView" class="absolute inset-0 p-4 md:p-6 overflow-y-auto flex flex-col gap-4 w-full transform translate-x-full transition-transform duration-300 bg-white dark:bg-gray-800 invisible">
            <h3 class="text-xl font-bold dark:text-gray-100">Update Specific Anki Card</h3>
            <p class="text-sm text-gray-600 dark:text-gray-400">Enter the Note ID (NID) of the card you want to update. You can find this in Anki's browser.</p>
            <div class="flex gap-2">
              <input type="number" id="ankiTargetNid" placeholder="e.g. 1700000000000" class="flex-1 p-2 border rounded dark:bg-gray-800 dark:border-gray-600 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
              <button onclick="sendToAnkiSpecific(this)" class="bg-indigo-600 text-white px-4 py-2 rounded font-bold hover:bg-indigo-700 transition shadow-sm whitespace-nowrap">Update Card</button>
            </div>
            <!-- Placeholder for future search results -->
            <div class="flex-grow mt-4 border-t dark:border-gray-700 pt-8 flex items-center justify-center text-gray-400 text-sm">
              Card search functionality coming soon.
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Context Modal -->
    <div id="contextModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex justify-center items-center p-2 md:p-4 z-50">
      <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-3xl w-full overflow-hidden border dark:border-gray-700 flex flex-col max-h-[80vh] md:max-h-[90vh]">
        <div class="p-4 border-b dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-700">
          <h3 class="font-bold text-lg dark:text-white">Conversation Context</h3>
          <button onclick="closeModal('contextModal')" class="text-gray-500 hover:text-red-500 dark:text-gray-300 dark:hover:text-red-400 font-bold text-xl">&times;</button>
        </div>
        <div class="p-4 md:p-6 overflow-y-auto flex-grow bg-white dark:bg-gray-800">
          <div id="contextLoading" class="flex justify-center items-center py-8 hidden">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
          </div>
          <div id="contextList" class="flex flex-col gap-2"></div>
        </div>
      </div>
    </div>

    <!-- Timeline Tooltip -->
    <div id="timelineTooltip" class="hidden fixed z-[9999] bg-gray-900 text-white text-xs px-2 py-1.5 rounded shadow-xl pointer-events-none max-w-sm whitespace-normal transform -translate-x-1/2 -translate-y-full mt-[-8px]"></div>

    <script src="/static/js/main.js"></script>
  
    <!-- Toast Notification -->
    <div id="toastContainer" class="fixed bottom-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

  </body>
</html>
