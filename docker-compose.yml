version: '3.8'

services:
  hagi:
    build: .
    container_name: hagi
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist /data so SQLite can create /data/hagi.db as a regular file
      - hagi-data:/data
      # Mount the NAS directory so the container can access your anime files
      - /mnt/NAS:/mnt/NAS:ro

volumes:
  hagi-data:
