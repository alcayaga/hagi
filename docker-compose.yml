version: '3.8'

services:
  nadeshiko:
    build: .
    container_name: local-nadeshiko
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount only the database file to persist it safely
      - ./nadeshiko.db:/app/nadeshiko.db
      # Mount the NAS directory so the container can access your anime files
      - /mnt/NAS:/mnt/NAS:ro
